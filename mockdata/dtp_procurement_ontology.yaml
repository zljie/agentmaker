      rules:
        - id: dtp/rule_po_must_from_approved_pr
          name: 禁止无申请下单
          severity: error
          when: { entity: action }
          constraint: { type: governance, field: "purchase_orders.purchase_requisition_id" }
          message: 采购订单必须来源于已审批的采购申请(PR),严禁无申请下单。
          remediation: 确认PR状态为Approved并建立PO-PR引用关系后再下达PO。
        - id: dtp/rule_gr_requires_valid_po_status
          name: 收货必须基于有效PO
          severity: error
          when: { entity: dataset }
          constraint: { type: governance, field: "goods_receipts.purchase_order_id" }
          message: 收货仅允许针对状态为已发送/已确认的PO进行,禁止无单到货或对未发布PO收货。
          remediation: 先完成PO发布与供应商确认,再进行收货与过账。
        - id: dtp/rule_budget_check_before_pr_submit
          name: PR提交前预算校验
          severity: warn
          when: { entity: dataset }
          constraint: { type: control, field: "purchase_requisitions.budget_check_result" }
          message: 采购申请提交/审批前必须完成预算可用额度校验,预算不足应拦截或升级审批。
          remediation: 补充预算或走超预算审批流程后再继续。
        - id: dtp/rule_master_data_required
          name: 关键主数据必须提前维护
          severity: warn
          when: { entity: dataset }
          constraint: { type: data_quality }
          message: 物料/供应商/组织等主数据缺失会导致流程无法合规执行,必须标准化维护并可追溯。
          remediation: 先在MDM维护物料与供应商,再允许创建PR/PO。
        - id: dtp/rule_balance_inventory_before_purchase
          name: 利库优先于新购
          severity: info
          when: { entity: dataset }
          constraint: { type: policy }
          message: 在满足交期与质量前提下,优先使用现存库存或跨组织调拨满足需求,减少重复采购与资金占用。
          remediation: 优先生成balancing_recommendations,仅对recommendation_type=purchase的净需求创建PR。
