# Render Blueprint - agentmaker
# 部署命令: render blueprint render.yaml

services:
  - type: web
    name: agentmaker
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: DEBUG
        value: false
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      # LLM 配置（可选，根据需要设置）
      # - key: LLM_API_KEY
      #   sync: false
      # - key: LLM_MODEL_NAME
      #   value: gpt-4o
